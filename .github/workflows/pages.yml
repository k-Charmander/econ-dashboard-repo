name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [ claude/economic-dashboard-mockup-6a4sl2 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건으로 제한 (진행 중 배포는 취소하지 않고 큐 대기)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare publish directory (공개 콘텐츠만 게시)
        run: |
          # 공개 대시보드만 _site로 복사. 개발/도구 파일 제외.
          # council/(개인 금융정보)는 별도 private 저장소로 분리됨 — 재유입 방지용 안전장치로 exclude·guard 유지.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'node_modules' \
            --exclude 'council' \
            --exclude '_site' \
            ./ _site/
          # 안전장치: council/ 또는 .jsx가 산출물에 남아 있으면 배포 실패 처리
          if [ -e _site/council ] || find _site -name '*.jsx' | grep -q .; then
            echo "::error::비공개 콘텐츠(council/ 또는 .jsx)가 _site에 포함됨 — 배포 중단"
            exit 1
          fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # council/(개인정보) 제외한 공개 콘텐츠만 게시
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
